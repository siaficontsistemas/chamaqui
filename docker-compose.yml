services:
  frontend:
    build:
      context: .
      dockerfile: ./frontend/Dockerfile
      args:
        VITE_API_BASE_URL: http://localhost:4200
    container_name: helpdesk-frontend
    depends_on:
      - backend
    ports:
      - "3000:3000"

  backend:
    build:
      context: ./backend/helpdesk
      dockerfile: Dockerfile
    container_name: helpdesk-backend
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SERVER_PORT: 4200
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/helpdesk
      SPRING_DATASOURCE_USERNAME: helpdesk
      SPRING_DATASOURCE_PASSWORD: helpdesk
      SPRING_JPA_HIBERNATE_DDL_AUTO: validate
      SPRING_MAIL_HOST: ${SPRING_MAIL_HOST}
      SPRING_MAIL_PORT: ${SPRING_MAIL_PORT}
      SPRING_MAIL_USERNAME: ${SPRING_MAIL_USERNAME}
      SPRING_MAIL_PASSWORD: ${SPRING_MAIL_PASSWORD}
      SPRING_MAIL_SMTP_AUTH: ${SPRING_MAIL_SMTP_AUTH}
      SPRING_MAIL_SMTP_STARTTLS_ENABLE: ${SPRING_MAIL_SMTP_STARTTLS_ENABLE}
      SPRING_MAIL_SMTP_SSL_ENABLE: ${SPRING_MAIL_SMTP_SSL_ENABLE:-false}
      APP_MAIL_FROM: ${APP_MAIL_FROM:-chamaqui@siaficont.com.br}
      APP_MAIL_TICKET_CLOSURE_FROM: ${APP_MAIL_TICKET_CLOSURE_FROM}
      APP_MAIL_COMPANY_INVITE_FROM: ${APP_MAIL_COMPANY_INVITE_FROM}
      APP_FRONTEND_BASE_URL: http://lvh.me:3000
      APP_TENANCY_BASE_DOMAIN: lvh.me
      APP_TENANCY_MAIN_HOSTS: localhost,127.0.0.1,lvh.me,www.lvh.me
      APP_WHATSAPP_BASE_URL: ${APP_WHATSAPP_BASE_URL:-http://baileys:21465}
      APP_WHATSAPP_API_KEY: ${APP_WHATSAPP_API_KEY:-}
      APP_WHATSAPP_WEBHOOK_URL: ${APP_WHATSAPP_WEBHOOK_URL:-http://backend:4200/webhook}
    ports:
      - "4200:4200"

  baileys:
    build:
      context: ./baileys-service
      dockerfile: Dockerfile
    container_name: helpdesk-baileys
    restart: unless-stopped
    environment:
      PORT: "21465"
      BAILEYS_API_KEY: ${APP_WHATSAPP_API_KEY:-}
      APP_WHATSAPP_WEBHOOK_URL: ${APP_WHATSAPP_WEBHOOK_URL:-http://backend:4200/webhook}
      BAILEYS_LOG_LEVEL: ${BAILEYS_LOG_LEVEL:-silent}
    ports:
      - "21465:21465"
    volumes:
      - baileys_auth:/data/auth

  postgres:
    image: postgres:17-alpine
    container_name: helpdesk-postgres
    environment:
      POSTGRES_DB: helpdesk
      POSTGRES_USER: helpdesk
      POSTGRES_PASSWORD: helpdesk
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U helpdesk -d helpdesk"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
  baileys_auth:
