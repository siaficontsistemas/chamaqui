spring.application.name=helpdesk
server.port=${SERVER_PORT:4200}
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/helpdesk}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:helpdesk}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:helpdesk}
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:none}
spring.jpa.open-in-view=false
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.validate-migration-naming=true
spring.flyway.validate-on-migrate=true
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=alpha
springdoc.swagger-ui.tags-sorter=alpha
spring.servlet.multipart.max-file-size=${SPRING_SERVLET_MULTIPART_MAX_FILE_SIZE:25MB}
spring.servlet.multipart.max-request-size=${SPRING_SERVLET_MULTIPART_MAX_REQUEST_SIZE:100MB}
app.storage.attachments-dir=${APP_STORAGE_ATTACHMENTS_DIR:${user.home}/.helpdesk/uploads/ticket-attachments}
app.storage.attachments-legacy-dirs=${APP_STORAGE_ATTACHMENTS_LEGACY_DIRS:${user.dir}/uploads/ticket-attachments}
app.validation.cnpj-api-base-url=${APP_VALIDATION_CNPJ_API_BASE_URL:https://brasilapi.com.br/api}
app.validation.cnpj-api-connect-timeout-ms=${APP_VALIDATION_CNPJ_API_CONNECT_TIMEOUT_MS:5000}
app.validation.cnpj-api-read-timeout-ms=${APP_VALIDATION_CNPJ_API_READ_TIMEOUT_MS:8000}
spring.mail.host=${SPRING_MAIL_HOST:${SMTP_HOST:}}
spring.mail.port=${SPRING_MAIL_PORT:${SMTP_PORT:587}}
spring.mail.username=${SPRING_MAIL_USERNAME:${SMTP_USERNAME:}}
spring.mail.password=${SPRING_MAIL_PASSWORD:${SMTP_PASSWORD:}}
spring.mail.properties.mail.smtp.auth=${SPRING_MAIL_SMTP_AUTH:${SMTP_AUTH:true}}
spring.mail.properties.mail.smtp.starttls.enable=${SPRING_MAIL_SMTP_STARTTLS_ENABLE:${SMTP_STARTTLS:true}}
spring.mail.properties.mail.smtp.ssl.enable=${SPRING_MAIL_SMTP_SSL_ENABLE:${SMTP_SSL:false}}
app.mail.from=${APP_MAIL_FROM:chamaqui@siaficont.com.br}
app.mail.ticket-closure.from=${APP_MAIL_TICKET_CLOSURE_FROM:${app.mail.from}}
app.mail.company-invite.from=${APP_MAIL_COMPANY_INVITE_FROM:${app.mail.from}}
app.frontend.base-url=${APP_FRONTEND_BASE_URL:http://localhost:5173}
app.whatsapp.base-url=${APP_WHATSAPP_BASE_URL:http://localhost:21465}
app.whatsapp.api-key=${APP_WHATSAPP_API_KEY:}
app.whatsapp.webhook-url=${APP_WHATSAPP_WEBHOOK_URL:}
