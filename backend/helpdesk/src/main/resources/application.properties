spring.application.name=helpdesk
server.port=${SERVER_PORT:4200}
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/helpdesk}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:helpdesk}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:helpdesk}
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:none}
spring.jpa.open-in-view=false
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.validate-migration-naming=true
spring.flyway.validate-on-migrate=true
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=alpha
springdoc.swagger-ui.tags-sorter=alpha
spring.servlet.multipart.max-file-size=${SPRING_SERVLET_MULTIPART_MAX_FILE_SIZE:100MB}
spring.servlet.multipart.max-request-size=${SPRING_SERVLET_MULTIPART_MAX_REQUEST_SIZE:120MB}
app.storage.attachments-dir=${APP_STORAGE_ATTACHMENTS_DIR:${user.home}/.helpdesk/uploads/ticket-attachments}
app.storage.attachments-legacy-dirs=${APP_STORAGE_ATTACHMENTS_LEGACY_DIRS:${user.dir}/uploads/ticket-attachments}
app.storage.attachments-max-file-size-bytes=${APP_STORAGE_ATTACHMENTS_MAX_FILE_SIZE_BYTES:262144000}
app.storage.company-logos-dir=${APP_STORAGE_COMPANY_LOGOS_DIR:${user.home}/.helpdesk/uploads/company-logos}
app.storage.company-logos-s3.bucket=${APP_STORAGE_COMPANY_LOGOS_S3_BUCKET:}
app.storage.company-logos-s3.region=${APP_STORAGE_COMPANY_LOGOS_S3_REGION:us-east-1}
app.storage.company-logos-s3.prefix=${APP_STORAGE_COMPANY_LOGOS_S3_PREFIX:company-logos}
app.storage.company-logos-s3.endpoint=${APP_STORAGE_COMPANY_LOGOS_S3_ENDPOINT:}
app.storage.company-logos-s3.path-style-access=${APP_STORAGE_COMPANY_LOGOS_S3_PATH_STYLE_ACCESS:false}
app.validation.cnpj-api-base-url=${APP_VALIDATION_CNPJ_API_BASE_URL:https://brasilapi.com.br/api}
app.validation.cnpj-api-connect-timeout-ms=${APP_VALIDATION_CNPJ_API_CONNECT_TIMEOUT_MS:5000}
app.validation.cnpj-api-read-timeout-ms=${APP_VALIDATION_CNPJ_API_READ_TIMEOUT_MS:8000}
app.validation.email-dns-timeout-initial-ms=${APP_VALIDATION_EMAIL_DNS_TIMEOUT_INITIAL_MS:2000}
app.validation.email-dns-timeout-retries=${APP_VALIDATION_EMAIL_DNS_TIMEOUT_RETRIES:1}
spring.mail.host=${SPRING_MAIL_HOST:${SMTP_HOST:}}
spring.mail.port=${SPRING_MAIL_PORT:${SMTP_PORT:587}}
spring.mail.username=${SPRING_MAIL_USERNAME:${SMTP_USERNAME:}}
spring.mail.password=${SPRING_MAIL_PASSWORD:${SMTP_PASSWORD:}}
spring.mail.properties.mail.smtp.auth=${SPRING_MAIL_SMTP_AUTH:${SMTP_AUTH:true}}
spring.mail.properties.mail.smtp.starttls.enable=${SPRING_MAIL_SMTP_STARTTLS_ENABLE:${SMTP_STARTTLS:true}}
spring.mail.properties.mail.smtp.ssl.enable=${SPRING_MAIL_SMTP_SSL_ENABLE:${SMTP_SSL:false}}
app.mail.from=${APP_MAIL_FROM:chamaqui@siaficont.com.br}
app.mail.ticket-closure.from=${APP_MAIL_TICKET_CLOSURE_FROM:${app.mail.from}}
app.mail.company-invite.from=${APP_MAIL_COMPANY_INVITE_FROM:${app.mail.from}}
app.frontend.base-url=${APP_FRONTEND_BASE_URL:http://localhost:5173}
app.tenancy.base-domain=${APP_TENANCY_BASE_DOMAIN:chamaqui.app.br}
app.tenancy.main-hosts=${APP_TENANCY_MAIN_HOSTS:localhost,127.0.0.1,chamaqui.app.br,www.chamaqui.app.br}
app.tenancy.reserved-subdomains=${APP_TENANCY_RESERVED_SUBDOMAINS:admin,api,www}
app.platform-admin.full-name=${APP_PLATFORM_ADMIN_FULL_NAME:Lopes Consultoria}
app.platform-admin.email=${APP_PLATFORM_ADMIN_EMAIL:lopesconsultoria.ba@gmail.com}
app.platform-admin.password=${APP_PLATFORM_ADMIN_PASSWORD:999679256}
app.whatsapp.base-url=${APP_WHATSAPP_BASE_URL:http://localhost:21465}
app.whatsapp.api-key=${APP_WHATSAPP_API_KEY:}
app.whatsapp.webhook-url=${APP_WHATSAPP_WEBHOOK_URL:}
app.web-push.public-key=${APP_WEB_PUSH_PUBLIC_KEY:}
app.web-push.private-key=${APP_WEB_PUSH_PRIVATE_KEY:}
app.web-push.subject=${APP_WEB_PUSH_SUBJECT:mailto:chamaqui@siaficont.com.br}
