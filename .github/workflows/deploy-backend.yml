name: Deploy Backend

on:
  push:
    branches:
      - main
    paths:
      - "backend/helpdesk/**"
      - "baileys-service/**"
      - "scripts/deploy/**"
      - ".github/workflows/deploy-backend.yml"
  workflow_dispatch:

concurrency:
  group: deploy-backend
  cancel-in-progress: false

permissions:
  contents: read

env:
  JAVA_VERSION: "21"
  NODE_VERSION: "22"
  EC2_SSH_HOST: ${{ vars.EC2_SSH_HOST || secrets.EC2_SSH_HOST }}
  EC2_SSH_USER: ${{ vars.EC2_SSH_USER || secrets.EC2_SSH_USER }}
  SSH_PORT: ${{ vars.EC2_SSH_PORT || '22' }}
  DEPLOY_ROOT: ${{ vars.DEPLOY_ROOT || '/home/ec2-user/deploy/chamaqui' }}
  BACKEND_JAR_PATH: ${{ vars.BACKEND_JAR_PATH || '/home/ec2-user/app.jar' }}
  BAILEYS_APP_DIR: ${{ vars.BAILEYS_APP_DIR || '/home/ec2-user/baileys-service' }}
  PM2_BACKEND_APP_NAME: ${{ vars.PM2_BACKEND_APP_NAME || 'chamaqui-backend' }}
  PM2_BAILEYS_APP_NAME: ${{ vars.PM2_BAILEYS_APP_NAME || 'chamaqui-baileys' }}
  RESTART_BAILEYS: ${{ vars.RESTART_BAILEYS || 'false' }}

jobs:
  deploy:
    name: Build and Deploy Backend
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate deploy configuration
        run: |
          required_vars=(
            EC2_SSH_HOST
            EC2_SSH_USER
            BACKEND_JAR_PATH
            BAILEYS_APP_DIR
            PM2_BACKEND_APP_NAME
            PM2_BAILEYS_APP_NAME
          )

          for var_name in "${required_vars[@]}"; do
            if [ -z "${!var_name}" ]; then
              echo "Variavel obrigatoria ausente: ${var_name}" >&2
              exit 1
            fi
          done

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: baileys-service/package-lock.json

      - name: Build backend
        working-directory: backend/helpdesk
        run: ./mvnw -B -DskipTests package

      - name: Prepare release bundle
        working-directory: .
        run: |
          rm -rf release
          mkdir -p release/backend release/baileys-service

          BACKEND_JAR="$(find backend/helpdesk/target -maxdepth 1 -type f -name '*.jar' ! -name '*.jar.original' ! -name 'original-*.jar' | head -n 1)"
          if [ -z "${BACKEND_JAR}" ]; then
            echo "Nenhum jar do backend foi encontrado." >&2
            exit 1
          fi

          cp "${BACKEND_JAR}" release/backend/app.jar
          cp baileys-service/package.json release/baileys-service/package.json
          cp baileys-service/package-lock.json release/baileys-service/package-lock.json
          cp -a baileys-service/src release/baileys-service/src

          tar -czf chamaqui-backend-release.tar.gz -C release .

      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.EC2_SSH_PRIVATE_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -p "${SSH_PORT}" -H "${EC2_SSH_HOST}" >> ~/.ssh/known_hosts

      - name: Upload release bundle
        run: |
          scp -P "${SSH_PORT}" \
            ./chamaqui-backend-release.tar.gz \
            "${EC2_SSH_USER}@${EC2_SSH_HOST}:/tmp/chamaqui-backend-release-${GITHUB_SHA}.tar.gz"

      - name: Deploy on EC2
        run: |
          ssh -p "${SSH_PORT}" "${EC2_SSH_USER}@${EC2_SSH_HOST}" \
            "DEPLOY_ROOT='${DEPLOY_ROOT}' BACKEND_JAR_PATH='${BACKEND_JAR_PATH}' BAILEYS_APP_DIR='${BAILEYS_APP_DIR}' PM2_BACKEND_APP_NAME='${PM2_BACKEND_APP_NAME}' PM2_BAILEYS_APP_NAME='${PM2_BAILEYS_APP_NAME}' RESTART_BAILEYS='${RESTART_BAILEYS}' bash -s -- '/tmp/chamaqui-backend-release-${GITHUB_SHA}.tar.gz'" \
            < ./scripts/deploy/ec2-deploy.sh
